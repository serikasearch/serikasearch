{{ header|safe }}
<main class="tool-page" id="main">
  <h1>{{ name }}</h1>
  <p class="lede">{{ blurb }}</p>
  <form class="tool-form" action="/tools/{{ slug }}" method="get">
    <div class="searchbox">
      <span class="ico" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
      </span>
      <input type="text" name="q" value="{{ query }}" placeholder="{{ example }}"
             aria-label="{{ name }} input" autocomplete="off" spellcheck="false"
             enterkeyhint="go" autofocus/>
      <button type="submit" class="submit-btn">Go</button>
    </div>
  </form>
  <div class="tool-examples">{{ examples|safe }}</div>
  {{ answer|safe }}
  <div class="tool-related">
    <h2 style="font-size:var(--fs-md);margin-bottom:var(--sp-4)">Other tools</h2>
    <div class="tool-grid">{{ others|safe }}</div>
  </div>
</main>
{% include "components/footer.html" %}
