<div class="shortcuts" id="shortcuts" hidden role="dialog" aria-modal="true"
     aria-labelledby="shortcuts-title">
  <div class="shortcuts-panel">
    <h2 id="shortcuts-title">Keyboard shortcuts</h2>
    <div class="shortcut-row"><span>Focus the search box</span><span class="keys"><kbd>/</kbd></span></div>
    <div class="shortcut-row"><span>Next result</span><span class="keys"><kbd>j</kbd></span></div>
    <div class="shortcut-row"><span>Previous result</span><span class="keys"><kbd>k</kbd></span></div>
    <div class="shortcut-row"><span>Open highlighted result</span><span class="keys"><kbd>Enter</kbd></span></div>
    <div class="shortcut-row"><span>Switch tab</span><span class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></span></div>
    <div class="shortcut-row"><span>Previous / next page</span><span class="keys"><kbd>←</kbd><kbd>→</kbd></span></div>
    <div class="shortcut-row"><span>Close dialogs</span><span class="keys"><kbd>Esc</kbd></span></div>
    <div class="shortcut-row"><span>This list</span><span class="keys"><kbd>?</kbd></span></div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost btn-sm" data-sc-close>Close</button>
    </div>
  </div>
</div>
