<article class="result {{ mod }}" style="--i:{{ i }}">
  <div class="result-site">
    <img class="favicon" src="/icon?h={{ host_q }}" alt="" width="18" height="18"
         loading="lazy" decoding="async"/>
    <span class="site-text">
      <span class="host">{{ site_name }}</span>
      <span class="path">{{ display_url }}</span>
    </span>
  </div>
  <h3><a href="{{ url }}" {{ target|safe }}>{{ title }}</a></h3>
  <p class="snippet">{{ snippet|safe }}</p>
  {{ rich|safe }}
  {{ sections|safe }}
</article>
