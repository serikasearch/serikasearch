<a class="image-card" style="--i:{{ i }}" data-ratio="{{ ratio }}" href="{{ page_url }}"
   {{ target|safe }}
   data-src="{{ src }}" data-page="{{ page_url }}" data-index="{{ i }}"
   data-title="{{ caption }}" data-host="{{ host }}"
   data-w="{{ width }}" data-h="{{ height }}">
  <span class="thumb-wrap">
    <img class="thumb" src="{{ src }}" alt="{{ caption }}" loading="lazy" decoding="async"
         referrerpolicy="no-referrer"/>
  </span>
  <span class="cap">
    <img class="cap-icon" src="/icon?h={{ host_q }}" alt="" width="14" height="14"
         loading="lazy" decoding="async"/>
    <span class="cap-text">
      <span class="cap-title">{{ caption }}</span>
      <span class="cap-host">{{ host }}</span>
    </span>
  </span>
</a>
