<article class="video-card" style="--i:{{ i }}"
         data-embed="{{ embed_url }}" data-platform="{{ platform }}" data-id="{{ embed_id }}"
         data-page="{{ url }}">
  <a class="video-thumb" href="{{ url }}" target="_blank" rel="noopener noreferrer"
     data-embed-trigger aria-label="Play {{ title }}">
    {{ thumb_block|safe }}
    <span class="video-play">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </span>
    <span class="video-duration">{{ platform }}</span>
  </a>
  <div class="video-info">
    <a class="video-title" href="{{ url }}" target="_blank" rel="noopener noreferrer">{{ title }}</a>
    <div class="video-meta">
      <img class="video-favicon" src="/icon?h={{ host_q }}" alt="" width="14" height="14"/>
      <a class="video-host" href="/search?q=site%3A{{ host_q }}">{{ host }}</a>
    </div>
  </div>
</article>
