<form class="searchbox" action="/search" method="get" role="search">
  <span class="ico" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/>
    </svg>
  </span>
  <input type="text" name="q" value="{{ query }}" placeholder="Search the web"
         autocomplete="off" spellcheck="false" {{ autofocus }} aria-label="Search query"/>
  <button type="button" class="clear-btn" aria-label="Clear search" tabindex="-1">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  {{ hidden|safe }}
  <button type="submit" class="submit-btn">Search</button>
</form>
