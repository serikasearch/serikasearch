<div class="video-modal" id="videoModal" hidden aria-hidden="true" role="dialog"
     aria-modal="true" aria-label="Video player">
  <div class="video-modal-scrim" data-vm-close></div>
  <div class="video-modal-body">
    <button class="video-modal-close" data-vm-close aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="video-modal-stage">
      <iframe id="videoModalFrame" allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen></iframe>
    </div>
  </div>
</div>
