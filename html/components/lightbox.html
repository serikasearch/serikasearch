<aside class="lb" id="lightbox" hidden aria-hidden="true" role="dialog"
       aria-modal="false" aria-label="Image details">
  <div class="lb-bar">
    <span class="lb-count" aria-live="polite"></span>
    <button class="icon-btn lb-prev" aria-label="Previous image">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="icon-btn lb-next" aria-label="Next image">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="icon-btn lb-close" data-close aria-label="Close image details">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="lb-body">
    <div class="lb-stage">
      <img class="lb-img" alt="" referrerpolicy="no-referrer"/>
      <button class="lb-step prev" aria-label="Previous image" tabindex="-1">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
      </button>
      <button class="lb-step next" aria-label="Next image" tabindex="-1">
        <span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>

    <div class="lb-meta">
      <div class="lb-meta-head">
        <img class="lb-favicon" alt="" width="20" height="20"/>
        <div class="lb-meta-text">
          <h2 class="lb-title"></h2>
          <a class="lb-host" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
      <div class="lb-dims"></div>
      <div class="lb-actions">
        <a class="lb-action primary lb-visit" target="_blank" rel="noopener noreferrer">
          Visit page
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>
        <a class="lb-action lb-open" target="_blank" rel="noopener noreferrer">Open image</a>
        <button class="lb-action lb-copy" type="button">Copy link</button>
      </div>
    </div>

    <div class="lb-similar">
      <h3 class="lb-similar-heading">Similar images</h3>
      <div class="lb-similar-grid" aria-live="polite"></div>
      <p class="lb-similar-empty" hidden>No similar images found.</p>
    </div>
  </div>
</aside>
